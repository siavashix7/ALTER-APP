name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Compute release tag
        id: tag
        run: echo "name=ALTER-$(date +'%Y%m%d-%H%M')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release (APK directly, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ALTER Build ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}