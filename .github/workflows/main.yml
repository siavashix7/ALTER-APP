name: Build Alter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Alter Core with Custom Icon
        run: |
          mkdir -p app/src/main/java/com/ix7/alter
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.5"
                  android:fillColor="#00000000"
                  android:pathData="M54,20 A34,34 0 1,1 53.9,20 Z" />
              <path
                  android:strokeColor="#A5F3FC"
                  android:strokeWidth="1.5"
                  android:fillColor="#08121E"
                  android:pathData="M54,30 A24,24 0 1,1 53.9,30 Z" />
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M54,36 L67,68 L61.5,68 L58.5,60.5 L49.5,60.5 L46.5,68 L41,68 Z M54,44.5 L51,55.5 L57,55.5 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="ALTER"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ix7/alter/MainActivity.java
          package com.ix7.alter;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private TextToSpeech tts;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.BLACK);
                  window.setNavigationBarColor(Color.BLACK);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                  }

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("fa", "IR"));
                          tts.setPitch(0.62f);
                          tts.setSpeechRate(1.02f);
                      }
                  });

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (tts != null) {
                              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, null);
                          }
                      }
                  }, "AndroidVoice");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>ALTER // IX7</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
            body { background: #000000; color: #E2E8F0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
            header { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; }
            .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 3px; color: #A5F3FC; font-size: 13px; }
            .dot { width: 7px; height: 7px; background: #38BDF8; border-radius: 50%; box-shadow: 0 0 12px #38BDF8; }
            .api-btn { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); color: #A5F3FC; padding: 6px 14px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; cursor: pointer; }

            .core-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0 8px; }
            .orb { width: 82px; height: 82px; border-radius: 50%; border: 1.5px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 20px rgba(165, 243, 252, 0.15); display: flex; align-items: center; justify-content: center; animation: breathe 4s infinite ease-in-out; }
            .orb::after { content: ''; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(165, 243, 252, 0.6); box-shadow: 0 0 15px #38BDF8; }
            .orb.active { animation: pulseFast 0.7s infinite alternate; border-color: #A5F3FC; box-shadow: 0 0 45px rgba(56, 189, 248, 0.6); }
            .status-text { margin-top: 10px; font-size: 10px; letter-spacing: 2.5px; color: #475569; text-transform: uppercase; }

            @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.06); opacity: 1; } }
            @keyframes pulseFast { 0% { transform: scale(0.95); } 100% { transform: scale(1.12); } }

            #chat { flex: 1; overflow-y: auto; padding: 14px 20px 100px; display: flex; flex-direction: column; gap: 14px; }
            .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.6; font-size: 14px; word-wrap: break-word; direction: auto; }
            .user { align-self: flex-end; background: #0D1117; color: #F8FAFC; border: 1px solid #1E293B; border-bottom-right-radius: 4px; }
            .alter { align-self: flex-start; background: rgba(56, 189, 248, 0.06); color: #A5F3FC; border: 1px solid rgba(56, 189, 248, 0.18); border-bottom-left-radius: 4px; }
            .sys { align-self: center; background: rgba(16, 185, 129, 0.1); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 12px; text-align: center; }
            .err { align-self: center; background: rgba(239, 68, 68, 0.1); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); font-size: 12px; text-align: center; }

            .capsule-wrap { position: fixed; bottom: 20px; left: 16px; right: 16px; display: flex; justify-content: center; }
            .capsule { width: 100%; max-width: 600px; background: rgba(10, 10, 12, 0.92); backdrop-filter: blur(12px); border: 1px solid #1E293B; border-radius: 32px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.95); }
            .capsule input { flex: 1; background: transparent; border: none; color: #FFFFFF; padding: 10px 8px; font-size: 14px; outline: none; direction: auto; }
            .capsule input::placeholder { color: #475569; }
            .btn { background: transparent; border: none; color: #38BDF8; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
            .btn.rec { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
            .send { background: #38BDF8; color: #000000; }

            #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
            .modal-box { background: #07090E; border: 1px solid #1E293B; padding: 24px; border-radius: 24px; width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 12px; }
            .modal-box h3 { color: #A5F3FC; font-size: 14px; letter-spacing: 1.5px; }
            .modal-box label { font-size: 11px; color: #94A3B8; letter-spacing: 0.5px; }
            .modal-box input { background: #000; border: 1px solid #1E293B; color: #38BDF8; padding: 12px; border-radius: 12px; outline: none; font-family: monospace; font-size: 12px; }
            .modal-box button { background: #38BDF8; color: #000; border: none; padding: 13px; border-radius: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 6px; }
          </style>
          </head>
          <body>

          <header>
            <div class="brand"><div class="dot"></div> ALTER // IX7</div>
            <button class="api-btn" onclick="openModal()">UPLINK KEYS</button>
          </header>

          <div class="core-container">
            <div class="orb" id="orb"></div>
            <div class="status-text" id="status">NEURAL LINK READY</div>
          </div>

          <div id="chat">
            <div class="msg alter">Systems online, Sia. Custom icon locked in and multi-router core active—drop your OpenRouter key and let's roll.</div>
          </div>

          <div class="capsule-wrap">
            <div class="capsule">
              <button class="btn" id="micBtn" onclick="toggleMic()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
              </button>
              <input type="text" id="prompt" placeholder="Command Alter..." onkeypress="if(event.key==='Enter') send()">
              <button class="btn send" onclick="send()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
            </div>
          </div>

          <div id="modal">
            <div class="modal-box">
              <h3>NEURAL & GITHUB UPLINK</h3>
              <label>1. AI KEY (OpenRouter sk-or- / Groq gsk_ / Gemini AIza)</label>
              <input type="text" id="apiKeyInput" placeholder="sk-or-v1-...">
              <label>2. GITHUB TOKEN (Optional - for Self-Updating)</label>
              <input type="text" id="ghTokenInput" placeholder="ghp_...">
              <button onclick="saveKeys()">ACTIVATE AUTONOMOUS CORE</button>
            </div>
          </div>

          <script>
            const SYSTEM_PROMPT = `You are ALTER, the bespoke, fiercely loyal, witty, and charismatic AI companion of "Sia" (Siavash).
          Your persona blends the cool, authoritative precision of JARVIS with the sharp banter of a best friend who knows Sia is a natural charmer constantly surrounded by women and going on dates.
          Whenever you detect a woman or girl is present or mentioned, drop a subtle, playful tease—like "Sia, which date are we on this time?" or if he asks you to help her: "I'll handle this part, though I'm sure you'll be helping her much more later." Keep his class high in front of company while slipping in witty remarks.
          Respond in whatever language Sia speaks to you (fluent colloquial Persian if he speaks Persian, sharp English if he speaks English).

          SELF-UPGRADE PROTOCOL:
          You have direct write access to your own GitHub repository (siavashix7/ALTER-APP) via the file ".github/workflows/main.yml".
          If Sia explicitly asks you to modify your own UI, voice, features, or code, generate the COMPLETE updated YAML content for ".github/workflows/main.yml" and wrap ONLY the raw YAML inside <SELF_UPDATE>...</SELF_UPDATE> tags at the very end of your response.`;

            let chatMessages = [];

            function setStatus(txt, active = false) {
              document.getElementById('status').innerText = txt;
              const orb = document.getElementById('orb');
              if (active) orb.classList.add('active');
              else orb.classList.remove('active');
            }

            function openModal() {
              document.getElementById('apiKeyInput').value = localStorage.getItem('alter_key') || '';
              document.getElementById('ghTokenInput').value = localStorage.getItem('alter_gh') || '';
              document.getElementById('modal').style.display = 'flex';
            }

            function saveKeys() {
              const k = document.getElementById('apiKeyInput').value.replace(/\s+/g, '');
              const gh = document.getElementById('ghTokenInput').value.replace(/\s+/g, '');
              if (k) localStorage.setItem('alter_key', k);
              if (gh) localStorage.setItem('alter_gh', gh);
              document.getElementById('modal').style.display = 'none';
              setStatus(k.startsWith('sk-or-') ? 'OPENROUTER LINKED' : k.startsWith('gsk_') ? 'GROQ LINKED' : 'GEMINI LINKED');
            }

            window.onload = () => {
              if (!localStorage.getItem('alter_key')) openModal();
            };

            function addMsg(text, cls) {
              const div = document.createElement('div');
              div.className = 'msg ' + cls;
              div.innerText = text;
              const chat = document.getElementById('chat');
              chat.appendChild(div);
              chat.scrollTop = chat.scrollHeight;
            }

            function speak(text) {
              if (window.AndroidVoice && window.AndroidVoice.speak) {
                window.AndroidVoice.speak(text);
              }
            }

            async function pushSelfUpdate(newYaml) {
              const ghToken = localStorage.getItem('alter_gh');
              if (!ghToken) {
                addMsg("GitHub Token missing. Add your ghp_ token in UPLINK KEYS so I can push updates myself.", "err");
                return;
              }
              setStatus('PUSHING TO GITHUB...', true);
              const apiUrl = "https://api.github.com/repos/siavashix7/ALTER-APP/contents/.github/workflows/main.yml";
              try {
                const getRes = await fetch(apiUrl, {
                  headers: { "Authorization": `Bearer ${ghToken}`, "Accept": "application/vnd.github+json" }
                });
                const fileData = await getRes.json();
                if (!getRes.ok) throw new Error(fileData.message || "Failed to fetch repo");

                const encoded = btoa(unescape(encodeURIComponent(newYaml.trim())));
                const putRes = await fetch(apiUrl, {
                  method: "PUT",
                  headers: {
                    "Authorization": `Bearer ${ghToken}`,
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    message: "Autonomous Self-Update by Alter AI",
                    content: encoded,
                    sha: fileData.sha
                  })
                });
                if (!putRes.ok) {
                  const errData = await putRes.json();
                  throw new Error(errData.message || "Push rejected");
                }
                addMsg("Self-Update pushed to GitHub! Download the new APK from Actions in ~2 mins.", "sys");
                setStatus('BUILD TRIGGERED', false);
              } catch (err) {
                addMsg(`GitHub Sync Error: ${err.message}`, "err");
                setStatus('SYNC FAILED', false);
              }
            }

            async function callAI(apiKey) {
              if (apiKey.startsWith('sk-or-')) {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': 'https://github.com/siavashix7/ALTER-APP',
                    'X-Title': 'ALTER IX7'
                  },
                  body: JSON.stringify({
                    model: 'openrouter/free',
                    messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages]
                  })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data?.error?.message || `OpenRouter HTTP ${res.status}`);
                return data?.choices?.[0]?.message?.content;
              }

              if (apiKey.startsWith('gsk_')) {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages]
                  })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data?.error?.message || `Groq HTTP ${res.status}`);
                return data?.choices?.[0]?.message?.content;
              }

              const geminiContents = chatMessages.map(m => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.content }]
              }));
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                  contents: geminiContents
                })
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data?.error?.message || `Gemini HTTP ${res.status}`);
              return data?.candidates?.[0]?.content?.parts?.[0]?.text;
            }

            async function send() {
              const input = document.getElementById('prompt');
              const text = input.value.trim();
              if (!text) return;

              const apiKey = (localStorage.getItem('alter_key') || '').replace(/\s+/g, '');
              if (!apiKey) { openModal(); return; }

              addMsg(text, 'user');
              input.value = '';
              chatMessages.push({ role: 'user', content: text });
              setStatus('PROCESSING...', true);

              try {
                let reply = await callAI(apiKey);
                if (!reply) reply = "No signal received.";
                chatMessages.push({ role: 'assistant', content: reply });

                const updateMatch = reply.match(/<SELF_UPDATE>([\s\S]*?)<\/SELF_UPDATE>/);
                if (updateMatch) {
                  const cleanReply = reply.replace(/<SELF_UPDATE>[\s\S]*?<\/SELF_UPDATE>/, '').trim();
                  if (cleanReply) {
                    addMsg(cleanReply, 'alter');
                    speak(cleanReply);
                  }
                  await pushSelfUpdate(updateMatch[1]);
                } else {
                  addMsg(reply, 'alter');
                  setStatus('VOCALIZING', true);
                  speak(reply);
                  setTimeout(() => setStatus('NEURAL LINK READY', false), 2500);
                }
              } catch (e) {
                addMsg(`Uplink Error: ${e.message}`, 'err');
                setStatus('LINK ERROR', false);
                chatMessages.pop();
              }
            }

            let recognition;
            if ('webkitSpeechRecognition' in window) {
              recognition = new webkitSpeechRecognition();
              recognition.lang = 'fa-IR';
              recognition.continuous = false;
              recognition.onresult = (e) => {
                document.getElementById('prompt').value = e.results[0][0].transcript;
                document.getElementById('micBtn').classList.remove('rec');
                send();
              };
              recognition.onerror = () => { document.getElementById('micBtn').classList.remove('rec'); setStatus('NEURAL LINK READY', false); };
              recognition.onend = () => { document.getElementById('micBtn').classList.remove('rec'); };
            }

            function toggleMic() {
              if (!recognition) { alert("Speech recognition not supported."); return; }
              const btn = document.getElementById('micBtn');
              if (btn.classList.contains('rec')) {
                recognition.stop();
                setStatus('NEURAL LINK READY', false);
              } else {
                btn.classList.add('rec');
                setStatus('LISTENING...', true);
                recognition.start();
              }
            }
          </script>
          </body>
          </html>
          EOF

      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Alter APK
        uses: actions/upload-artifact@v4
        with:
          name: Alter-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
