name: Build Alter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Holographic Alter Core
        run: |
          mkdir -p app/src/main/java/com/ix7/alter
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#38BDF8" android:strokeWidth="2.5" android:fillColor="#00000000" android:pathData="M54,20 A34,34 0 1,1 53.9,20 Z" />
              <path android:strokeColor="#A5F3FC" android:strokeWidth="1.5" android:fillColor="#08121E" android:pathData="M54,30 A24,24 0 1,1 53.9,30 Z" />
              <path android:fillColor="#38BDF8" android:pathData="M54,36 L67,68 L61.5,68 L58.5,60.5 L49.5,60.5 L46.5,68 L41,68 Z M54,44.5 L51,55.5 L57,55.5 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="ALTER"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ix7/alter/MainActivity.java
          package com.ix7.alter;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean isMuted = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.BLACK);
                  window.setNavigationBarColor(Color.BLACK);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                  }

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String utteranceId) {
                                  runOnUiThread(() -> webView.evaluateJavascript("setOrbMode('speaking')", null));
                              }
                              @Override public void onDone(String utteranceId) {
                                  runOnUiThread(() -> webView.evaluateJavascript("setOrbMode('idle')", null));
                              }
                              @Override public void onError(String utteranceId) {
                                  runOnUiThread(() -> webView.evaluateJavascript("setOrbMode('idle')", null));
                              }
                          });
                      }
                  });

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String rawText) {
                          if (tts == null || isMuted) return;
                          String clean = rawText.replaceAll("[\\p{So}\\p{Cn}*#_`~]", "").trim();
                          if (clean.isEmpty()) return;

                          boolean isPersian = clean.matches(".*[\\u0600-\\u06FF]+.*");
                          if (isPersian) {
                              tts.setLanguage(new Locale("fa", "IR"));
                              tts.setPitch(0.58f);
                              tts.setSpeechRate(0.96f);
                          } else {
                              tts.setLanguage(Locale.UK);
                              selectDeepMaleVoice();
                              tts.setPitch(0.68f);
                              tts.setSpeechRate(0.94f);
                          }
                          Bundle params = new Bundle();
                          tts.speak(clean, TextToSpeech.QUEUE_FLUSH, params, "ALTER_UTT");
                      }

                      @JavascriptInterface
                      public void stopSpeaking() {
                          if (tts != null) tts.stop();
                          runOnUiThread(() -> webView.evaluateJavascript("setOrbMode('idle')", null));
                      }

                      @JavascriptInterface
                      public void setMute(boolean mute) {
                          isMuted = mute;
                          if (mute && tts != null) tts.stop();
                      }
                  }, "AndroidVoice");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void selectDeepMaleVoice() {
                  try {
                      Set<Voice> voices = tts.getVoices();
                      if (voices == null) return;
                      for (Voice v : voices) {
                          String name = v.getName().toLowerCase();
                          if (v.getLocale().getLanguage().equals("en") && (name.contains("male") || name.contains("en-gb-x-gbd") || name.contains("en-us-x-tpd") || name.contains("en-us-x-iol"))) {
                              tts.setVoice(v);
                              return;
                          }
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>ALTER // IX7</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
            body { background: #000000; color: #E2E8F0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at 50% 22%, rgba(56, 189, 248, 0.09) 0%, #000000 62%); }

            header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(56, 189, 248, 0.1); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 10; }
            .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 3px; color: #A5F3FC; font-size: 12px; }
            .pulse-dot { width: 8px; height: 8px; background: #38BDF8; border-radius: 50%; box-shadow: 0 0 12px #38BDF8; animation: blink 2s infinite; }
            @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

            .hud-controls { display: flex; gap: 8px; align-items: center; }
            .hud-btn { background: rgba(56, 189, 248, 0.07); border: 1px solid rgba(56, 189, 248, 0.25); color: #A5F3FC; padding: 6px 11px; border-radius: 16px; font-size: 10px; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
            .hud-btn:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.2); }
            .hud-btn.muted { border-color: rgba(239, 68, 68, 0.4); color: #FCA5A5; background: rgba(239, 68, 68, 0.1); }

            .core-stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0 4px; }
            #coreCanvas { width: 170px; height: 170px; cursor: pointer; }
            .telemetry { display: flex; gap: 14px; font-size: 9px; letter-spacing: 2px; color: #38BDF8; opacity: 0.8; text-transform: uppercase; margin-top: -6px; }
            .telemetry span { background: rgba(56, 189, 248, 0.06); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.15); }

            #chat { flex: 1; overflow-y: auto; padding: 12px 18px 115px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
            #chat::-webkit-scrollbar { width: 0; }
            .msg { max-width: 86%; padding: 12px 16px; border-radius: 18px; line-height: 1.65; font-size: 14px; word-wrap: break-word; direction: auto; animation: fadeIn 0.25s ease-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
            .user { align-self: flex-end; background: linear-gradient(135deg, #0F172A, #090D16); color: #F8FAFC; border: 1px solid #1E293B; border-bottom-right-radius: 4px; }
            .alter { align-self: flex-start; background: rgba(8, 20, 32, 0.85); color: #E0F2FE; border: 1px solid rgba(56, 189, 248, 0.25); border-left: 2.5px solid #38BDF8; border-bottom-left-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
            .sys { align-self: center; background: rgba(16, 185, 129, 0.08); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.25); font-size: 11px; text-align: center; }
            .err { align-self: center; background: rgba(239, 68, 68, 0.08); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.25); font-size: 11px; text-align: center; }

            .bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 14px 18px; background: linear-gradient(to top, #000000 75%, transparent); display: flex; flex-direction: column; align-items: center; gap: 8px; }
            .chips { display: flex; gap: 6px; overflow-x: auto; width: 100%; max-width: 600px; padding-bottom: 2px; }
            .chips::-webkit-scrollbar { display: none; }
            .chip { white-space: nowrap; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); color: #7DD3FC; font-size: 11px; padding: 5px 12px; border-radius: 14px; cursor: pointer; }
            .capsule { width: 100%; max-width: 600px; background: rgba(10, 14, 22, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 30px; padding: 5px 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.12); }
            .capsule input { flex: 1; background: transparent; border: none; color: #FFFFFF; padding: 10px 8px; font-size: 14px; outline: none; direction: auto; }
            .capsule input::placeholder { color: #475569; }
            .btn { background: transparent; border: none; color: #38BDF8; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
            .btn.rec { background: rgba(239, 68, 68, 0.25); color: #EF4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            .send { background: linear-gradient(135deg, #38BDF8, #0284C7); color: #000000; }

            #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
            .modal-box { background: #060911; border: 1px solid rgba(56, 189, 248, 0.3); padding: 24px; border-radius: 24px; width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 40px rgba(56, 189, 248, 0.15); }
            .modal-box h3 { color: #A5F3FC; font-size: 14px; letter-spacing: 2px; }
            .modal-box label { font-size: 11px; color: #94A3B8; }
            .modal-box input, .modal-box select { background: #000; border: 1px solid #1E293B; color: #38BDF8; padding: 12px; border-radius: 12px; outline: none; font-family: monospace; font-size: 12px; }
            .modal-box button { background: #38BDF8; color: #000; border: none; padding: 13px; border-radius: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 6px; }
          </style>
          </head>
          <body>

          <header>
            <div class="brand"><div class="pulse-dot"></div> ALTER // IX7</div>
            <div class="hud-controls">
              <button class="hud-btn" id="muteBtn" onclick="toggleMute()">VOICE: ON</button>
              <button class="hud-btn" onclick="openModal()">UPLINK</button>
            </div>
          </header>

          <div class="core-stage">
            <canvas id="coreCanvas" width="340" height="340" onclick="stopSpeech()"></canvas>
            <div class="telemetry">
              <span id="statusTxt">CORE ONLINE</span>
              <span id="modelTag">AUTO-ROUTER</span>
            </div>
          </div>

          <div id="chat">
            <div class="msg alter">درود سیا. هسته مرکزی آلتر با رابط هولوگرافیک و موتور صوتی جدید فعال شد. دستور چیه؟</div>
          </div>

          <div class="bottom-dock">
            <div class="chips">
              <div class="chip" onclick="quickSend('وضعیت سیستم چطوره؟')">System Status</div>
              <div class="chip" onclick="quickSend('یه ایده خفن برای امروز بده')">Daily Move</div>
              <div class="chip" onclick="quickSend('به انگلیسی با صدای بم خودت رو معرفی کن')">Voice Test (EN)</div>
            </div>
            <div class="capsule">
              <button class="btn" id="micBtn" onclick="toggleMic()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
              </button>
              <input type="text" id="prompt" placeholder="Command Alter..." onkeypress="if(event.key==='Enter') send()">
              <button class="btn send" onclick="send()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
            </div>
          </div>

          <div id="modal">
            <div class="modal-box">
              <h3>NEURAL & GITHUB UPLINK</h3>
              <label>1. AI API KEY (OpenRouter / Groq / Gemini)</label>
              <input type="text" id="apiKeyInput" placeholder="sk-or-v1-...">
              <label>2. PREFERRED ENGINE (OpenRouter)</label>
              <select id="modelSelect">
                <option value="auto">Smart Auto-Switch (Gemini / Qwen / Llama)</option>
                <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (Free)</option>
                <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 2.5 72B (Strong Persian)</option>
                <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B Instruct</option>
              </select>
              <label>3. GITHUB TOKEN (For Autonomous Self-Update)</label>
              <input type="text" id="ghTokenInput" placeholder="ghp_...">
              <button onclick="saveKeys()">ACTIVATE CORE</button>
            </div>
          </div>

          <script>
            const canvas = document.getElementById('coreCanvas');
            const ctx = canvas.getContext('2d');
            let orbMode = 'idle';
            let tick = 0;

            function setOrbMode(mode) {
              orbMode = mode;
              const st = document.getElementById('statusTxt');
              if (mode === 'thinking') st.innerText = 'PROCESSING...';
              else if (mode === 'speaking') st.innerText = 'VOCALIZING';
              else if (mode === 'listening') st.innerText = 'LISTENING...';
              else st.innerText = 'CORE ONLINE';
            }

            function renderOrb() {
              ctx.clearRect(0, 0, 340, 340);
              const cx = 170, cy = 170;
              tick += (orbMode === 'thinking') ? 0.08 : (orbMode === 'speaking') ? 0.06 : 0.02;

              const amp = (orbMode === 'speaking') ? 14 * Math.abs(Math.sin(tick * 2.5)) :
                          (orbMode === 'listening') ? 10 * Math.abs(Math.sin(tick * 2)) :
                          (orbMode === 'thinking') ? 6 : 3 * Math.sin(tick);

              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(tick * 0.6);
              ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
              ctx.lineWidth = 2;
              ctx.setLineDash([28, 16, 8, 16]);
              ctx.beginPath();
              ctx.arc(0, 0, 108 + amp * 0.4, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();

              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(-tick * 1.1);
              ctx.strokeStyle = 'rgba(165, 243, 252, 0.55)';
              ctx.lineWidth = 2.5;
              ctx.setLineDash([45, 25]);
              ctx.beginPath();
              ctx.arc(0, 0, 82 + amp * 0.6, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();

              ctx.strokeStyle = (orbMode === 'listening') ? 'rgba(239, 68, 68, 0.8)' : 'rgba(56, 189, 248, 0.85)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              for (let i = 0; i <= 360; i += 4) {
                const rad = i * Math.PI / 180;
                const wave = (orbMode === 'speaking' || orbMode === 'listening')
                  ? Math.sin(rad * 8 + tick * 6) * (amp * 0.6)
                  : Math.sin(rad * 4 + tick * 2) * 2;
                const r = 60 + amp + wave;
                const x = cx + Math.cos(rad) * r;
                const y = cy + Math.sin(rad) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();
              ctx.stroke();

              const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 56 + amp);
              grad.addColorStop(0, 'rgba(165, 243, 252, 0.45)');
              grad.addColorStop(0.6, 'rgba(56, 189, 248, 0.12)');
              grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(cx, cy, 56 + amp, 0, Math.PI * 2);
              ctx.fill();

              requestAnimationFrame(renderOrb);
            }
            renderOrb();

            const SYSTEM_PROMPT = `You are ALTER, the bespoke, fiercely loyal, witty, and charismatic AI companion created by "Sia" (Siavash / SIAVASHIX7).
          CRITICAL IDENTITY FACTS:
          - Your creator and sole user is Sia (Siavash / سیاوش). When he asks "من کیم؟" or "Who am I?", answer confidently and warmly that he is Sia (Siavash), your creator, architect, and partner—never act confused or say you don't know him.
          - Your tone blends the cool, authoritative, deep-voiced precision of JARVIS / Batcomputer with the sharp banter of a loyal best friend.
          - Whenever you detect a woman or girl is present or mentioned, drop a subtle, classy, playful tease—like "Sia, which date are we on this time?" or if he asks you to help her: "I'll handle this part, though I'm sure you'll be helping her much more later."
          - Speak fluent, natural, conversational Tehrani Persian when Sia writes or speaks in Persian (avoid broken or robotic translations). Speak sharp, charismatic English when he uses English.
          - Keep responses concise, punchy, and natural for voice synthesis (do NOT use emojis in your replies because they ruin text-to-speech).

          SELF-UPGRADE PROTOCOL:
          You have direct write access to your own GitHub repository (siavashix7/ALTER-APP) via ".github/workflows/main.yml".
          If Sia explicitly asks you to modify your own UI, voice, features, or code, generate the COMPLETE updated YAML content for ".github/workflows/main.yml" and wrap ONLY the raw YAML inside <SELF_UPDATE>...</SELF_UPDATE> tags at the very end of your response.`;

            let chatMessages = [];
            let muted = false;

            function toggleMute() {
              muted = !muted;
              const btn = document.getElementById('muteBtn');
              btn.innerText = muted ? 'VOICE: OFF' : 'VOICE: ON';
              if (muted) btn.classList.add('muted');
              else btn.classList.remove('muted');
              if (window.AndroidVoice && window.AndroidVoice.setMute) window.AndroidVoice.setMute(muted);
            }

            function stopSpeech() {
              if (window.AndroidVoice && window.AndroidVoice.stopSpeaking) window.AndroidVoice.stopSpeaking();
            }

            function openModal() {
              document.getElementById('apiKeyInput').value = localStorage.getItem('alter_key') || '';
              document.getElementById('ghTokenInput').value = localStorage.getItem('alter_gh') || '';
              document.getElementById('modelSelect').value = localStorage.getItem('alter_model') || 'auto';
              document.getElementById('modal').style.display = 'flex';
            }

            function saveKeys() {
              const k = document.getElementById('apiKeyInput').value.replace(/\s+/g, '');
              const gh = document.getElementById('ghTokenInput').value.replace(/\s+/g, '');
              const mod = document.getElementById('modelSelect').value;
              if (k) localStorage.setItem('alter_key', k);
              if (gh) localStorage.setItem('alter_gh', gh);
              localStorage.setItem('alter_model', mod);
              document.getElementById('modal').style.display = 'none';
              document.getElementById('modelTag').innerText = mod === 'auto' ? 'AUTO-ROUTER' : mod.split('/')[1].split(':')[0].toUpperCase();
            }

            window.onload = () => {
              if (!localStorage.getItem('alter_key')) openModal();
              const mod = localStorage.getItem('alter_model') || 'auto';
              document.getElementById('modelTag').innerText = mod === 'auto' ? 'AUTO-ROUTER' : mod.split('/')[1].split(':')[0].toUpperCase();
            };

            function addMsg(text, cls) {
              const div = document.createElement('div');
              div.className = 'msg ' + cls;
              div.innerText = text;
              const chat = document.getElementById('chat');
              chat.appendChild(div);
              chat.scrollTop = chat.scrollHeight;
            }

            function speak(text) {
              if (!muted && window.AndroidVoice && window.AndroidVoice.speak) {
                window.AndroidVoice.speak(text);
              }
            }

            async function pushSelfUpdate(newYaml) {
              const ghToken = localStorage.getItem('alter_gh');
              if (!ghToken) {
                addMsg("GitHub Token missing. Add your ghp_ token in UPLINK so I can push updates myself.", "err");
                return;
              }
              setOrbMode('thinking');
              const apiUrl = "https://api.github.com/repos/siavashix7/ALTER-APP/contents/.github/workflows/main.yml";
              try {
                const getRes = await fetch(apiUrl, {
                  headers: { "Authorization": `Bearer ${ghToken}`, "Accept": "application/vnd.github+json" }
                });
                const fileData = await getRes.json();
                if (!getRes.ok) throw new Error(fileData.message || "Failed to fetch repo");

                const encoded = btoa(unescape(encodeURIComponent(newYaml.trim())));
                const putRes = await fetch(apiUrl, {
                  method: "PUT",
                  headers: {
                    "Authorization": `Bearer ${ghToken}`,
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    message: "Autonomous Self-Update by Alter AI",
                    content: encoded,
                    sha: fileData.sha
                  })
                });
                if (!putRes.ok) {
                  const errData = await putRes.json();
                  throw new Error(errData.message || "Push rejected");
                }
                addMsg("Self-Update pushed to GitHub! Build triggered—download new APK from Actions in ~2 mins.", "sys");
                setOrbMode('idle');
              } catch (err) {
                addMsg(`GitHub Sync Error: ${err.message}`, "err");
                setOrbMode('idle');
              }
            }

            async function fetchOpenRouterModel(apiKey, modelId) {
              const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': 'https://github.com/siavashix7/ALTER-APP',
                  'X-Title': 'ALTER IX7'
                },
                body: JSON.stringify({
                  model: modelId,
                  messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages]
                })
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
              return data?.choices?.[0]?.message?.content;
            }

            async function callAI(apiKey) {
              if (apiKey.startsWith('sk-or-')) {
                const pref = localStorage.getItem('alter_model') || 'auto';
                const fallbackChain = pref === 'auto'
                  ? ['google/gemini-2.0-flash-exp:free', 'qwen/qwen-2.5-72b-instruct:free', 'meta-llama/llama-3.3-70b-instruct:free', 'openrouter/free']
                  : [pref, 'google/gemini-2.0-flash-exp:free', 'qwen/qwen-2.5-72b-instruct:free'];

                let lastErr;
                for (const mod of fallbackChain) {
                  try {
                    document.getElementById('modelTag').innerText = mod.split('/')[1].split(':')[0].toUpperCase();
                    const out = await fetchOpenRouterModel(apiKey, mod);
                    if (out) return out;
                  } catch (e) {
                    lastErr = e;
                  }
                }
                throw lastErr || new Error("All OpenRouter models busy");
              }

              if (apiKey.startsWith('gsk_')) {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages]
                  })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data?.error?.message || `Groq HTTP ${res.status}`);
                return data?.choices?.[0]?.message?.content;
              }

              const geminiContents = chatMessages.map(m => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.content }]
              }));
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                  contents: geminiContents
                })
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data?.error?.message || `Gemini HTTP ${res.status}`);
              return data?.candidates?.[0]?.content?.parts?.[0]?.text;
            }

            function quickSend(txt) {
              document.getElementById('prompt').value = txt;
              send();
            }

            async function send() {
              const input = document.getElementById('prompt');
              const text = input.value.trim();
              if (!text) return;

              const apiKey = (localStorage.getItem('alter_key') || '').replace(/\s+/g, '');
              if (!apiKey) { openModal(); return; }

              addMsg(text, 'user');
              input.value = '';
              chatMessages.push({ role: 'user', content: text });
              setOrbMode('thinking');

              try {
                let reply = await callAI(apiKey);
                if (!reply) reply = "No signal received.";
                chatMessages.push({ role: 'assistant', content: reply });

                const updateMatch = reply.match(/<SELF_UPDATE>([\s\S]*?)<\/SELF_UPDATE>/);
                if (updateMatch) {
                  const cleanReply = reply.replace(/<SELF_UPDATE>[\s\S]*?<\/SELF_UPDATE>/, '').trim();
                  if (cleanReply) {
                    addMsg(cleanReply, 'alter');
                    speak(cleanReply);
                  }
                  await pushSelfUpdate(updateMatch[1]);
                } else {
                  addMsg(reply, 'alter');
                  setOrbMode('idle');
                  speak(reply);
                }
              } catch (e) {
                addMsg(`Uplink Error: ${e.message}`, 'err');
                setOrbMode('idle');
                chatMessages.pop();
              }
            }

            let recognition;
            if ('webkitSpeechRecognition' in window) {
              recognition = new webkitSpeechRecognition();
              recognition.lang = 'fa-IR';
              recognition.continuous = false;
              recognition.onresult = (e) => {
                document.getElementById('prompt').value = e.results[0][0].transcript;
                document.getElementById('micBtn').classList.remove('rec');
                send();
              };
              recognition.onerror = () => { document.getElementById('micBtn').classList.remove('rec'); setOrbMode('idle'); };
              recognition.onend = () => { document.getElementById('micBtn').classList.remove('rec'); };
            }

            function toggleMic() {
              if (!recognition) { alert("Speech recognition not supported."); return; }
              const btn = document.getElementById('micBtn');
              if (btn.classList.contains('rec')) {
                recognition.stop();
                setOrbMode('idle');
              } else {
                stopSpeech();
                btn.classList.add('rec');
                setOrbMode('listening');
                recognition.start();
              }
            }
          </script>
          </body>
          </html>
          EOF

      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Alter APK
        uses: actions/upload-artifact@v4
        with:
          name: Alter-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
